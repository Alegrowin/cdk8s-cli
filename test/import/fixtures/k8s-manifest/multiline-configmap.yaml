apiVersion: v1
kind: ConfigMap
metadata:
  name: multiline-configmap
data:
  # Using pipe (|) syntax - preserves newlines
  script.sh: |
    #!/bin/bash
    echo "Starting script"
    
    # Check if directory exists
    if [ -d "/data" ]; then
      echo "Data directory exists"
    else
      echo "Creating data directory"
      mkdir -p /data
    fi
    
    echo "Script completed"
  
  # Using pipe-dash (|-) syntax - strips trailing newlines
  config.properties: |-
    # Database configuration
    db.host=localhost
    db.port=5432
    db.name=myapp
    db.user=admin
    db.password=secret
    
    # Application settings
    app.log.level=INFO
    app.timeout=30
    app.max_connections=100
  
  # Regular single-line value
  API_URL: "https://api.example.com"
  
  # JSON data
  app-config.json: |
    {
      "name": "my-application",
      "version": "1.0.0",
      "features": {
        "authentication": true,
        "caching": true,
        "metrics": false
      }
    }
---
# Source: argo-cd/templates/redis/health-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-argo-cd-argocd-redis-health-configmap
  namespace: default
  labels:
    helm.sh/chart: argo-cd-7.8.14
    app.kubernetes.io/name: argocd-redis
    app.kubernetes.io/instance: my-argo-cd
    app.kubernetes.io/component: redis
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: "v2.14.8"
data:
  redis_liveness.sh: |
    response=$(
      redis-cli \
        -a "${REDIS_PASSWORD}" --no-auth-warning \
        -h localhost \
        -p 6379 \
        ping
    )
    if [ "$response" != "PONG" ] && [ "${response:0:7}" != "LOADING" ] ; then
      echo "$response"
      exit 1
    fi
    echo "response=$response"
  redis_readiness.sh: |
    response=$(
      redis-cli \
        -a "${REDIS_PASSWORD}" --no-auth-warning \
        -h localhost \
        -p 6379 \
        ping
    )
    if [ "$response" != "PONG" ] ; then
      echo "$response"
      exit 1
    fi
    echo "response=$response"